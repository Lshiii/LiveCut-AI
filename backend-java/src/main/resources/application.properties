spring.application.name=livecut-backend
server.address=127.0.0.1
server.port=${LIVECUT_API_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${LIVECUT_DB_URL}
spring.datasource.username=${LIVECUT_DB_USER}
spring.datasource.password=${LIVECUT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true

# Multipart spools to disk; the service also enforces the actual streamed size.
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=1073741824B
spring.servlet.multipart.max-request-size=1090519040B
livecut.storage.root=${LIVECUT_STORAGE_ROOT:../storage}
livecut.storage.max-video-bytes=${LIVECUT_MAX_VIDEO_BYTES:1073741824}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Internal worker endpoints fail closed while this separate credential is unset.
livecut.worker.api-key=${LIVECUT_WORKER_API_KEY:}
livecut.jobs.lease-seconds=${LIVECUT_JOB_LEASE_SECONDS:90}
livecut.jobs.hard-deadline-seconds=${LIVECUT_JOB_HARD_DEADLINE_SECONDS:1800}
livecut.jobs.max-attempts=${LIVECUT_JOB_MAX_ATTEMPTS:3}
livecut.jobs.retry-delay-seconds=${LIVECUT_JOB_RETRY_DELAY_SECONDS:2}
livecut.jobs.scan-enabled=${LIVECUT_JOB_SCAN_ENABLED:true}
livecut.jobs.scan-delay-ms=${LIVECUT_JOB_SCAN_DELAY_MS:1000}
