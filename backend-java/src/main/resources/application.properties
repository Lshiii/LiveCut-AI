spring.application.name=livecut-backend
server.address=127.0.0.1
server.port=${LIVECUT_API_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${LIVECUT_DB_URL}
spring.datasource.username=${LIVECUT_DB_USER}
spring.datasource.password=${LIVECUT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true

# Multipart spools to disk; the service also enforces the actual streamed size.
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.max-file-size=1073741824B
spring.servlet.multipart.max-request-size=1090519040B
livecut.storage.root=${LIVECUT_STORAGE_ROOT:../storage}
livecut.storage.max-video-bytes=${LIVECUT_MAX_VIDEO_BYTES:1073741824}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Internal worker endpoints fail closed while this separate credential is unset.
livecut.worker.api-key=${LIVECUT_WORKER_API_KEY:}
# Independent instance heartbeats and conservative execution-stage capacity.
livecut.workers.require-registration=${LIVECUT_WORKER_REQUIRE_REGISTRATION:true}
livecut.workers.heartbeat-timeout-seconds=${LIVECUT_WORKER_HEARTBEAT_TIMEOUT_SECONDS:35}
livecut.workers.ffmpeg-slots=${LIVECUT_FFMPEG_SLOTS:1}
livecut.workers.asr-slots=${LIVECUT_ASR_SLOTS:2}
livecut.workers.text-slots=${LIVECUT_TEXT_SLOTS:2}
livecut.jobs.lease-seconds=${LIVECUT_JOB_LEASE_SECONDS:90}
livecut.jobs.hard-deadline-seconds=${LIVECUT_JOB_HARD_DEADLINE_SECONDS:1800}
livecut.jobs.max-attempts=${LIVECUT_JOB_MAX_ATTEMPTS:3}
livecut.jobs.retry-delay-seconds=${LIVECUT_JOB_RETRY_DELAY_SECONDS:2}
livecut.jobs.scan-enabled=${LIVECUT_JOB_SCAN_ENABLED:true}
livecut.jobs.scan-delay-ms=${LIVECUT_JOB_SCAN_DELAY_MS:1000}

# Upload quotas cover active temporary copies, separate from published video storage.
livecut.uploads.chunk-size=${LIVECUT_UPLOAD_CHUNK_SIZE:8388608}
livecut.uploads.max-parts=4096
livecut.uploads.ttl-seconds=${LIVECUT_UPLOAD_TTL_SECONDS:86400}
livecut.uploads.lease-seconds=${LIVECUT_UPLOAD_LEASE_SECONDS:90}
livecut.uploads.max-active=${LIVECUT_UPLOAD_MAX_ACTIVE:8}
livecut.uploads.max-reserved-bytes=${LIVECUT_UPLOAD_MAX_RESERVED_BYTES:4294967296}
livecut.uploads.receive-slots=${LIVECUT_UPLOAD_RECEIVE_SLOTS:6}
livecut.uploads.merge-slots=${LIVECUT_UPLOAD_MERGE_SLOTS:1}
livecut.uploads.max-merge-attempts=3
livecut.uploads.scan-enabled=${LIVECUT_UPLOAD_SCAN_ENABLED:true}
livecut.uploads.scan-delay-ms=${LIVECUT_UPLOAD_SCAN_DELAY_MS:1000}

# Shared current-snapshot SSE fanout; no historical event log is implied.
livecut.events.poll-ms=${LIVECUT_EVENTS_POLL_MS:1000}
livecut.events.heartbeat-ms=${LIVECUT_EVENTS_HEARTBEAT_MS:15000}
livecut.events.timeout-ms=${LIVECUT_EVENTS_TIMEOUT_MS:120000}
livecut.events.max-connections=${LIVECUT_EVENTS_MAX_CONNECTIONS:32}
livecut.events.max-per-resource=${LIVECUT_EVENTS_MAX_PER_RESOURCE:8}
livecut.events.sender-threads=${LIVECUT_EVENTS_SENDER_THREADS:4}
livecut.events.sender-queue=${LIVECUT_EVENTS_SENDER_QUEUE:32}
livecut.events.scan-enabled=${LIVECUT_EVENTS_SCAN_ENABLED:true}
