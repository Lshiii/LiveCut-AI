name: Workbench package checks

on:
  push:
    paths:
      - 'backend-java/**'
      - 'frontend/**'
      - 'scripts/package-workbench.ps1'
      - 'scripts/run-workbench.ps1'
      - '.github/workflows/workbench.yml'
  pull_request:
    paths:
      - 'backend-java/**'
      - 'frontend/**'
      - 'scripts/package-workbench.ps1'
      - 'scripts/run-workbench.ps1'
      - '.github/workflows/workbench.yml'

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Make Maven wrapper executable
        run: chmod +x backend-java/mvnw
      - name: Build actual bundle and verify packaged routes without a server or database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = ./scripts/package-workbench.ps1
          if ($package -is [array] -or -not $package.PackageDirectory) { throw 'Unexpected package result.' }
          $frozenUi = Join-Path $package.BuildDirectory 'ui'
          $verificationOutput = Join-Path (Get-Location) ('data/ci-workbench-verification-' + [Guid]::NewGuid().ToString('N'))
          Push-Location backend-java
          try {
            & ./mvnw --batch-mode --no-transfer-progress -Pworkbench '-Dtest=WorkbenchDistValidatorTests,WorkbenchStaticResourcesTests' ('-Dworkbench.dist=' + $frozenUi) ('-Dworkbench.build.directory=' + $verificationOutput) verify
            if ($LASTEXITCODE -ne 0) { throw 'Packaged workbench route verification failed.' }
          } finally { Pop-Location }
          $manifest = Get-Content -LiteralPath $package.Manifest -Raw | ConvertFrom-Json
          if ($manifest.server_started -ne $false -or $manifest.worker_started -ne $false -or $manifest.model_requests -ne 0) { throw 'Build must not start runtime services.' }
          Write-Output ('Verified workbench JAR: ' + $package.Sha256)
