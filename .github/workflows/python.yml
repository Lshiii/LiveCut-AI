name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      LIVECUT_FFMPEG_PATH: /usr/bin/ffmpeg
      LIVECUT_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
          enable-cache: true
      - name: Install FFmpeg
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if [ -x "$LIVECUT_FFMPEG_PATH" ] && [ -x "$LIVECUT_FFPROBE_PATH" ] \
            && "$LIVECUT_FFMPEG_PATH" -version >/dev/null 2>&1 \
            && "$LIVECUT_FFPROBE_PATH" -version >/dev/null 2>&1; then
            echo "Using existing FFmpeg and ffprobe."
          else
            # Only Ubuntu packages are needed; unrelated runner repositories must
            # not block real-media tests or consume the entire job timeout.
            ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
            if [ ! -f "$ubuntu_sources" ]; then
              echo "::error::Expected Ubuntu 24.04 package sources are missing."
              exit 1
            fi
            apt_options=(
              -o "Dir::Etc::sourcelist=$ubuntu_sources"
              -o Dir::Etc::sourceparts=-
              -o APT::Get::List-Cleanup=0
              -o APT::Update::Error-Mode=any
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
              -o DPkg::Lock::Timeout=30
            )
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
          fi
          "$LIVECUT_FFMPEG_PATH" -version
          "$LIVECUT_FFPROBE_PATH" -version
      - name: Install locked dependencies
        run: uv sync --locked --dev --python 3.11
      - name: Lint
        run: uv run --frozen --no-sync ruff check worker-python
      - name: Test, including real media integration
        run: |
          uv run --frozen --no-sync pytest -q -ra --junitxml="$RUNNER_TEMP/pytest-results.xml"
          uv run --frozen --no-sync python - "$RUNNER_TEMP/pytest-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = ET.parse(sys.argv[1])
          skipped = report.findall('.//testcase/skipped')
          if skipped:
              raise SystemExit(f'CI requires every test to run; found {len(skipped)} skipped tests')
          PY
