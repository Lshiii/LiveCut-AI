name: Java checks

on:
  push:
    paths:
      - 'backend-java/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'backend-java/**'
      - '.github/workflows/java.yml'

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-java
    env:
      LIVECUT_DB_URL: jdbc:mysql://127.0.0.1:3306/livecut_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      LIVECUT_DB_USER: livecut
      LIVECUT_DB_PASSWORD: dummy
    services:
      mysql:
        image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
        env:
          # Disposable CI-only credentials, unrelated to any user account.
          MYSQL_DATABASE: livecut_test
          MYSQL_USER: livecut
          MYSQL_PASSWORD: dummy
          MYSQL_ROOT_PASSWORD: dummy-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=dummy-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Verify against real MySQL
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Require executed tests without skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('target').glob('**/TEST-*.xml'))
          if not reports:
              raise SystemExit('No Maven test reports were generated')
          for suite in ('VideoApiIntegrationTests', 'JobProtocolIntegrationTests', 'ModelCallIntegrationTests', 'ArtifactVerifierTests', 'ReviewIntegrationTests', 'ExportIntegrationTests', 'UploadApiIntegrationTests', 'UploadStorageLockTests', 'TaskEventsIntegrationTests', 'TaskEventsServiceTests'):
              if not any(path.name.endswith(f'{suite}.xml') for path in reports):
                  raise SystemExit(f'The real MySQL integration suite did not execute: {suite}')
          test_count = 0
          for path in reports:
              report = ET.parse(path)
              tests = report.findall('.//testcase')
              test_count += len(tests)
              if report.findall('.//testcase/skipped'):
                  raise SystemExit(f'CI requires every test to run: {path}')
          if test_count == 0:
              raise SystemExit('No Maven test cases were executed')
          print(f'Checked {test_count} test cases without skips')
          PY
