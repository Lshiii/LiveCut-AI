name: livecut

services:
  kafka:
    image: apache/kafka:4.0.2
    profiles: [kafka]
    ports:
      - "127.0.0.1:${LIVECUT_KAFKA_PORT:-19092}:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${LIVECUT_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.2
    profiles: [kafka]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "${LIVECUT_KAFKA_TOPIC:-livecut.stage-wakeup.v1}", "--partitions", "3", "--replication-factor", "1"]
    restart: "no"

  mysql:
    image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: livecut
      MYSQL_USER: livecut
      MYSQL_PASSWORD: ${LIVECUT_DB_PASSWORD:?Set LIVECUT_DB_PASSWORD in your private env file}
      MYSQL_ROOT_PASSWORD: ${LIVECUT_DB_ROOT_PASSWORD:?Set LIVECUT_DB_ROOT_PASSWORD in your private env file}
    ports:
      - "127.0.0.1:${LIVECUT_DB_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/001-test-database.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping --host=127.0.0.1 --user=\"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  kafka-data:
