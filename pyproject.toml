[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "livecut-ai"
version = "0.1.0"
description = "Catalog-free product timeline discovery and video clipping"
requires-python = ">=3.11,<3.15"
dependencies = ["jsonschema>=4.23,<5", "httpx>=0.28,<1"]

[project.scripts]
livecut = "livecut.cli:main"

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.20,<2",
    "rapidocr>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["worker-python/src/livecut"]

[tool.pytest.ini_options]
testpaths = ["worker-python/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
